server {
    listen 80;
    listen [::]:80;
    server_name finanpivot.com www.finanpivot.com;
    location /.well-known/acme-challenge/ {
        root /var/www/finanpivot/current;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name finanpivot.com www.finanpivot.com;
    ssl_certificate /etc/letsencrypt/live/finanpivot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finanpivot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/finanpivot/current;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
