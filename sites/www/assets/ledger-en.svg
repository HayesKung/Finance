<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#f7f1e6"/>
  <rect x="36" y="36" width="300" height="208" fill="#fffdf8" stroke="#1a1714" stroke-width="2"/>
  <text x="60" y="90" fill="#9c3b2e" font-family="sans-serif" font-size="20">Screenshot</text>
  <text x="60" y="140" fill="#1a1714" font-family="sans-serif" font-size="16">Only says it was sent</text>
